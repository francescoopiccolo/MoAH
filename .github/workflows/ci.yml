name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Inspect Windows sampler environment
        run: powershell.exe -NoProfile -NonInteractive -Command "Get-ExecutionPolicy -List; Get-CimInstance Win32_Process -Property ProcessId,ParentProcessId,WorkingSetSize,PrivatePageCount | Select-Object -First 1 ProcessId,ParentProcessId,WorkingSetSize,PrivatePageCount | Format-List"
      - run: npm test
      - run: npm pack --ignore-scripts --dry-run
